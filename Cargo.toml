[package]
name = "jack2wasapi"
version = "0.1.0"
edition = "2024"

[dependencies]
jack = "0.13"
cpal = { version = "0.17", features = ["audio_thread_priority", "jack"] }
clap = { version = "4.5", features = ["derive"] }
tray-icon = "0.14"
ringbuf = "0.2"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
dirs = "5.0"
ctrlc = "3.0"
dioxus = { version = "0.7.9", features = ["desktop"] }
dioxus-desktop = "0.7.9"
